name: Compare vulnerable and hardened builds

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v1-vulnerable, v2-hardened]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run version-specific test suite
        working-directory: versions/${{ matrix.version }}
        run: mvn -B test

  runtime-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start both isolated versions
        env:
          LAB_ADMIN_PASSWORD: disposable-admin-password
          LAB_CUSTOMER_PASSWORD: disposable-customer-password
        run: |
          docker compose -f compose.compare.yaml up --build -d
          for port in 8081 8082; do
            for attempt in $(seq 1 90); do
              if curl --silent --fail "http://127.0.0.1:${port}/actuator/health"; then
                break
              fi
              if [ "$attempt" -eq 90 ]; then
                docker compose -f compose.compare.yaml logs
                exit 1
              fi
              sleep 2
            done
          done
      - name: Assert same cross-customer attack differs by version
        env:
          LAB_CUSTOMER_PASSWORD: disposable-customer-password
        run: ./scripts/attack-comparison.sh
      - name: Detect IDOR in V1 only
        env:
          LAB_CUSTOMER_PASSWORD: disposable-customer-password
        run: |
          auth="$(printf 'lab-customer:%s' "$LAB_CUSTOMER_PASSWORD" | base64 -w0)"
          docker run --rm --network host -v "$PWD:/work" -w /work projectdiscovery/nuclei:v3.11.1 \
            -u http://127.0.0.1:8081 -t nuclei-templates/idor-v1.yaml \
            -H "Authorization: Basic $auth" -silent -jsonl -o /work/v1-nuclei.jsonl
          test -s v1-nuclei.jsonl
          docker run --rm --network host -v "$PWD:/work" -w /work projectdiscovery/nuclei:v3.11.1 \
            -u http://127.0.0.1:8082 -t nuclei-templates/idor-v1.yaml \
            -H "Authorization: Basic $auth" -silent -jsonl -o /work/v2-nuclei.jsonl
          test ! -s v2-nuclei.jsonl
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-version-runtime-evidence
          path: |
            v1-nuclei.jsonl
            v2-nuclei.jsonl
          if-no-files-found: ignore
      - name: Stop lab
        if: always()
        run: docker compose -f compose.compare.yaml down -v
