name: ClamAV upload regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  upload-malware-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_ADMIN_PASSWORD: disposable-admin-password
      LAB_CUSTOMER_PASSWORD: test-customer-password
    steps:
      - uses: actions/checkout@v4
      - name: Start application and ClamAV
        run: docker compose up -d --build
      - name: Wait for clean-file scan to become available
        run: |
          printf 'This is a harmless upload fixture.\n' > /tmp/clean.txt
          for attempt in $(seq 1 120); do
            code="$(curl --silent --output /tmp/clean-response --write-out '%{http_code}' \
              -u "lab-customer:$LAB_CUSTOMER_PASSWORD" \
              -F "file=@/tmp/clean.txt;type=text/plain" \
              http://127.0.0.1:8080/api/uploads || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/clean-response
              exit 0
            fi
            if [ "$code" != "503" ]; then
              echo "Unexpected clean upload response: $code"
              cat /tmp/clean-response
              exit 1
            fi
            sleep 5
          done
          docker compose logs app clamav
          echo "ClamAV did not become ready in time"
          exit 1
      - name: Confirm the harmless EICAR test signature is rejected
        run: |
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.txt
          code="$(curl --silent --output /tmp/eicar-response --write-out '%{http_code}' \
            -u "lab-customer:$LAB_CUSTOMER_PASSWORD" \
            -F "file=@/tmp/eicar.txt;type=text/plain" \
            http://127.0.0.1:8080/api/uploads || true)"
          cat /tmp/eicar-response
          test "$code" = "422"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs app clamav
      - name: Stop lab services
        if: always()
        run: docker compose down -v
