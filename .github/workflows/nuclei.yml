name: Nuclei lab regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  nuclei-idor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated vulnerable lab
        env:
          SPRING_PROFILES_ACTIVE: lab-vulnerable
          LAB_ADMIN_PASSWORD: disposable-admin-password
          LAB_CUSTOMER_PASSWORD: test-customer-password
        run: |
          mvn -B spring-boot:run > /tmp/ai-security-lab.log 2>&1 &
          echo $! > /tmp/ai-security-lab.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ai-security-lab.log
          exit 1
      - name: Detect the seeded IDOR with Nuclei
        run: |
          mkdir -p reports
          AUTH="$(printf 'lab-customer:test-customer-password' | base64 -w0)"
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            projectdiscovery/nuclei:v3.11.1 \
            -u http://127.0.0.1:8080 \
            -t nuclei-templates/lab-idor.yaml \
            -H "Authorization: Basic $AUTH" \
            -silent -jsonl -o /work/reports/nuclei-baseline.jsonl
          test -s reports/nuclei-baseline.jsonl
      - name: Upload sanitized Nuclei result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-baseline
          path: reports/nuclei-baseline.jsonl
          if-no-files-found: ignore
      - name: Stop isolated lab
        if: always()
        run: |
          if [ -f /tmp/ai-security-lab.pid ]; then
            kill "$(cat /tmp/ai-security-lab.pid)" || true
          fi
